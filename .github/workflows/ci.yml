name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-ubuntu:
    name: Test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install
        run: bun install
      - name: Install ffmpeg (encode/E2E tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test packages apps
      - name: Build CLI
        run: bun run --filter @videoos/cli build

  check-windows:
    # Windows：类型级验证 + CLI 构建。
    # 运行时级 Windows 验证由 desktop 工作流（electron-builder + 冒烟）承担。
    name: Check (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install
        run: bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Build CLI
        run: bun run --filter @videoos/cli build
