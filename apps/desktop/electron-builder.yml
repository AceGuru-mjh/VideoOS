# electron-builder 配置（Windows NSIS x64）
# 构建链：CI（GitHub Actions windows-latest）执行 —— 本地不安装 Electron 运行时。
appId: app.videoos.studio
productName: VideoOS Studio
copyright: Copyright © 2026 VideoOS contributors

# 发布源（v0.4 桌面自动更新）：electron-updater 经此生成 app-update.yml，
# 客户端自动检查 GitHub Releases 的 latest.yml（CI 已上传）→ 确认后差分下载 → 重启安装。
publish:
  provider: github
  owner: AceGuru-mjh
  repo: VideoOS
  releaseType: release

directories:
  output: release
  buildResources: build

# 仅打包 electron 主进程产物；视频引擎 sidecar 与 studio UI 走 extraResources
files:
  - dist-desktop/main.cjs
  - dist-desktop/preload.cjs
  - package.json

extraResources:
  # 视频引擎（bun 运行的 studio server 全量 bundle，含 @videoos/* + hono + ws）
  - from: dist-desktop/server.mjs
    to: server/server.mjs
  # bun 运行时（CI 从 oven-sh/bun releases 下载，windows-x64）
  - from: build/bun-windows-x64
    to: bun
  # Studio UI（apps/studio 的 vite 构建产物）
  - from: ../studio/dist
    to: studio

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: VideoOS Studio
  artifactName: VideoOS-Studio-Setup-${version}.${ext}
