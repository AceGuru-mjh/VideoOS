<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VideoOS Studio</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <style>
      /* pre-CSS paint: zero margin + theme-correct background (set by the
         script below) so there is no wrong-color flash before the bundle */
      html,
      body {
        margin: 0;
      }
    </style>
    <script>
      // apply the saved theme before first paint (issue #44):
      // data-theme for tokens + a matching background color on <html>
      (function () {
        var BG = {
          midnight: "#0b0f16",
          graphite: "#101214",
          amber: "#12100a",
          forest: "#081109",
          rose: "#140b10",
          sand: "#f5efe6",
          paper: "#fafaf7",
          daylight: "#f1f5f9",
          ocean: "#071118",
          cyber: "#0a0a12",
          coffee: "#14100c",
          mono: "#0c0c0d",
          sakura: "#fdeef4",
          mint: "#eefaf3",
          lavender: "#f3f0fb",
          ivory: "#f7f2e8",
        };
        var theme = "midnight";
        try {
          var saved = localStorage.getItem("videoos.theme");
          if (saved && BG[saved]) theme = saved;
        } catch (e) {
          /* storage unavailable — default theme */
        }
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.style.backgroundColor = BG[theme];
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
